name: astrbot_plugin_qzone_ultra_ce
version: 0.9.1
author: DFSMHFJ
desc: >-
  QQ空间Ultra CE（Community Edition）：基于上游 v0.9.0 修改并独立发布的版本。
  新闻说说由原本仅支持 Google News RSS 扩展为多源可选（IT之家、中新网、奇客Solidot、极客公园、爱范儿、少数派、Google News），
  支持 diverse / balanced / weighted / latest 四种混合策略，多源并发抓取并跨源去重。
  其余功能与上游 v0.9.0 一致；上游后续版本的新特性（如 Qzone Pages 富媒体）本版本尚未包含。
  需要完整上游功能请安装原版。
