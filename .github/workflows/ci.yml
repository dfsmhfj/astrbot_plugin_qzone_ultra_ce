name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装校验依赖
        run: pip install pyyaml

      - name: 语法编译检查
        run: python -m compileall -q main.py daemon_main.py qzone_bridge

      - name: news 回归测试
        env:
          PYTHONHASHSEED: "0"
        run: python tests/test_news.py

      - name: metadata 与打包体积自检
        run: python scripts/check_metadata.py
